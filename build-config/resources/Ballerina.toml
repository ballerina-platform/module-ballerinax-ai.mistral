[package]
authors = ["Ballerina"]
distribution = "2201.12.0"
keywords = ["AI/LLM", "Cost/Freemium", "Vendor/Mistral", "Area/AI & Machine Learning", "Type/Model Provider", "Type/Connector", "Name/Mistral Model Provider"]
license = ["Apache-2.0"]
icon="icon.png"
name = "ai.mistral"
org = "ballerinax"
repository = "https://github.com/ballerina-platform/module-ballerinax-ai.mistral"
version = "@toml.version@"

# TODO: Temporary local dependency on the `ballerina/ai` build that carries the
# streaming contract. Replace with a published release before merging.
[[dependency]]
org = "ballerina"
name = "ai"
version = "1.11.3"
repository = "local"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "ai.mistral-native"
version = "@toml.version@"
path = "../native/build/libs/ai.mistral-native-@project.version@.jar"
